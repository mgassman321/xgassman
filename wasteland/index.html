  buffalo:      'assets/buffalo_sheet.png',  // 1024x96, 8 frames 128x96: idle x2, charge x6
  zombie_gibs:  'assets/zombie_gibs.png',    // 256x32, 8 pieces 32x32
  alien_gibs:   'assets/alien_gibs.png',

const IMG = {};
// sprites that get a bold black silhouette outline so they pop off the sand (thickness in sprite pixels)
// cacti: number = thickness (canvas grows to fit). Others: { t, fw } = slight border kept inside the
// original canvas so draw code is unchanged; fw = frame width for sprite sheets (no bleed between frames).
// t is in sprite pixels, chosen so each lands at roughly 1px on screen at its in-game scale.
const OUTLINE = {
  cactus_0: 2.2, cactus_1: 2.2, cactus_2: 2.2,
  boulder_0: { t: 1.1 }, boulder_1: { t: 1.1 }, boulder_2: { t: 1.1 },
  tnt: { t: 0.75 }, ufo: { t: 0.6 }, car_wreck: { t: 0.6 },
  mound_0: { t: 0.7 }, mound_1: { t: 0.7 },
  zombie: { t: 0.55, fw: 64 }, alien: { t: 0.55, fw: 64 }, buffalo: { t: 0.55, fw: 128 },
  jackalope: { t: 0.55, fw: 64 }, coyote: { t: 0.55, fw: 96 }, bigfoot: { t: 0.55, fw: 96 }, roadrunner: { t: 0.55, fw: 64 },
  airstream: { t: 0.5 },
  pylon_0: { t: 0.5 }, pylon_1: { t: 0.5 }, pylon_2: { t: 0.5 },
  sign_stop_0: { t: 0.9 }, sign_stop_1: { t: 0.9 }, sign_stop_2: { t: 0.9 }, sign_66_0: { t: 0.9 }, sign_66_1: { t: 0.9 },
  sign_street: { t: 0.9 }, sign_wood_0: { t: 0.9 }, sign_wood_1: { t: 0.9 }, sign_wood_2: { t: 0.9 }, sign_vegas: { t: 0.8 }, eiffel_legs: { t: 0.6, fw: 256 }, statue_0: { t: 0.8 }, statue_1: { t: 0.8 },

// silhouette from the clearly-opaque pixels only, so faint background haze in a sprite never becomes a dark box
function solidSilhouette(g, w, h) {
  try {
    const d = g.getImageData(0, 0, w, h), p = d.data;
    for (let i = 0; i < p.length; i += 4) { const on = p[i + 3] > 110; p[i] = p[i + 1] = p[i + 2] = 20; p[i + 3] = on ? 255 : 0; }
    g.putImageData(d, 0, 0);
  } catch (e) {   // pixel access blocked (e.g. opened from disk): plain silhouette
    g.globalCompositeOperation = 'source-in'; g.fillStyle = '#141414'; g.fillRect(0, 0, w, h); g.globalCompositeOperation = 'source-over';
  }
}
function addOutlineInPlace(im, t, fw) {
  const w = im.width, h = im.height;
  const sil = document.createElement('canvas'); sil.width = w; sil.height = h;
  const sg = sil.getContext('2d'); sg.drawImage(im, 0, 0);
  solidSilhouette(sg, w, h);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const cell = fw || w;
  for (let x0 = 0; x0 < w; x0 += cell) {
    g.save(); g.beginPath(); g.rect(x0, 0, cell, h); g.clip();
    for (let a = 0; a < 16; a++) g.drawImage(sil, Math.cos(a / 16 * 6.283) * t, Math.sin(a / 16 * 6.283) * t);
    g.restore();
  }
  g.drawImage(im, 0, 0);
  return c;
}
function addOutline(im, t) {
  if (typeof t === 'object') return addOutlineInPlace(im, t.t, t.fw);
  const pad = t + 1, w = im.width + pad * 2, h = im.height + pad * 2;
  // solid black silhouette of the sprite
  const sil = document.createElement('canvas'); sil.width = w; sil.height = h;
  const sg = sil.getContext('2d'); sg.drawImage(im, pad, pad);
  solidSilhouette(sg, w, h);
  // stamp it in a ring to grow it, then put the original art on top
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  // one-sided: ink only on the right (shadow) side, matching the light from the upper left
  for (let a = 0; a < 24; a++) {
    const ang = a / 24 * 6.283, cx = Math.cos(ang), sy = Math.sin(ang);
    if (cx < 0.3) continue;
    for (const r of [t * 0.5, t]) g.drawImage(sil, cx * r, sy * r);
  }
  g.drawImage(im, pad, pad);
  c.pad = pad; c.srcW = im.width; c.srcH = im.height;
  return c;
}
for (const [k, src] of Object.entries(ASSETS)) {
  const im = new Image();
  im.onload = () => { IMG[k] = OUTLINE[k] ? addOutline(im, OUTLINE[k]) : im; };
  im.src = src;
}

/* ---------- canvas ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
window.addEventListener('resize', resize); resize();

/* ---------- palette & projection ---------- */
const PAPER = '#ffffff';
const INK = '#141414';
const K = 0.78;           // 3/4 view: ground-plane vertical squash
const CHUNK = 640;

/* ---------- seeded random ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let h = s ^ Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
let WORLD_SEED = (Math.random() * 1e9) | 0;

/* ---------- stipple patterns (darkness = dot density) ---------- */
function makeStipple(density, size = 96, dotR = 0.9, seed = 7) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const r = mulberry32(seed);
  g.fillStyle = INK;
  const n = Math.floor(size * size * density / 9);
  for (let i = 0; i < n; i++) {
    const x = r() * size, y = r() * size;
    const rr = dotR * (0.6 + r() * 0.8);
    g.beginPath(); g.arc(x, y, rr, 0, 6.283); g.fill();
    // wrap edges so tile is seamless
    if (x < 2) { g.beginPath(); g.arc(x + size, y, rr, 0, 6.283); g.fill(); }
    if (y < 2) { g.beginPath(); g.arc(x, y + size, rr, 0, 6.283); g.fill(); }
  }
  return ctx.createPattern(c, 'repeat');
}
const ST = {
  ground: makeStipple(0.025, 128, 0.8, 1),
  light:  makeStipple(0.10, 96, 0.9, 2),
  mid:    makeStipple(0.25, 96, 1.0, 3),
  dark:   makeStipple(0.55, 96, 1.1, 4),
  vdark:  makeStipple(1.1, 96, 1.2, 5),
};

// halftone for the car: an even dot grid (built at 3x so it stays crisp on retina screens)
function makeHalftone(spacing, r) {
  const R = 3, n = 4, size = Math.round(spacing * n * R);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = INK;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = (i + (j % 2) * 0.5 + 0.25) * spacing * R, y = (j + 0.5) * spacing * R;
    for (const dx of [0, size]) { g.beginPath(); g.arc((x + dx) % (size + 1), y, r * R, 0, 6.283); g.fill(); }
    if (x - r * R < 0) { g.beginPath(); g.arc(x + size, y, r * R, 0, 6.283); g.fill(); }
    if (x + r * R > size) { g.beginPath(); g.arc(x - size, y, r * R, 0, 6.283); g.fill(); }
  }
  const p = ctx.createPattern(c, 'repeat'); p.res = R; return p;
}
const HT = { light: makeHalftone(4, 0.55), mid: makeHalftone(3.2, 0.85), dark: makeHalftone(2.6, 1.05), vdark: makeHalftone(2.2, 1.15) };

/* ---------- input ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (state.mode === 'title' && (e.code === 'Space' || e.code === 'Enter')) startGame();
  else if (state.mode === 'dead' && state.deadT > (state.death === 'boom' ? 1.6 : 0.8) && (e.code === 'KeyR' || e.code === 'Enter' || e.code === 'Space')) startGame();
  else if (e.code === 'KeyR' && state.mode === 'play') startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const down = (...c) => c.some(k => keys[k]);

/* ---------- world generation ---------- */
const chunks = new Map();
const destroyed = new Set();

/* ---------- large landmarks: one per 1280px cell, kept fully inside the cell so they can never overlap ---------- */
const BIG = 1280;
const bigCache = new Map();
function towerClash(x, y, rad) {
  for (let i = Math.floor((x - rad - 300) / LINE_GAP); i <= Math.floor((x + rad + 300) / LINE_GAP); i++) {
    if (!powerLine(i)) continue;
    for (let k = Math.floor((y - rad) / TOWER_GAP) - 1; k <= Math.ceil((y + rad) / TOWER_GAP) + 1; k++) {
      const T = tower(i, k);
      if (Math.hypot(T.x - x, T.y - y) < rad + PYLON_ART.r[T.variant] + 40) return true;
    }
  }
  return false;
}
function bigCell(bx, by) {
  const key = bx + ',' + by;
  if (bigCache.has(key)) return bigCache.get(key);
  const r = mulberry32(hash2(bx, by, WORLD_SEED ^ 0x27d4eb2f));
  const out = [], ox = bx * BIG, oy = by * BIG;
  let n = 0;
  const mk = (type, x, y, rad, extra = {}) => ({ type, x, y, r: rad, id: `B${bx},${by},${n++}`, seed: (r() * 1e9) | 0, variant: 0, ...extra });
  const ok = (x, y, rad, spawn) => x - rad > ox + 40 && x + rad < ox + BIG - 40 && y - rad > oy + 40 && y + rad < oy + BIG - 40
    && Math.hypot(x, y) > rad + spawn && !roadAt(x, y, Math.min(rad, 160) + 20) && !towerClash(x, y, rad);
  // pick at most one landmark for this cell (weights match the old per-chunk rates)
  const q = r();
  let pick = null;
  const table = [['eiffel', 0.008], ['vegas', 0.012], ['airstream', 0.024], ['crater', 0.14], ['pyramid', 0.128], ['ufo', 0.012], ['pit', 0.08]];
  let acc = 0; for (const [t, p] of table) { acc += p; if (q < acc) { pick = t; break; } }
  if (pick) for (let tries = 0; tries < 10; tries++) {
    const x = ox + r() * BIG, y = oy + r() * BIG;
    if (pick === 'eiffel') {
      const E = EIFFEL.half + EIFFEL.legR;
      if (ok(x, y, E + 40, 700)) {
        [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy], i) => out.push(mk('leg', x + sx * EIFFEL.half, y + sy * EIFFEL.half, EIFFEL.legR, { variant: i })));
        break;
      }
    }
    else if (pick === 'vegas') { if (ok(x, y, 150, 700)) { out.push(mk('vegas', x, y, VEGAS.r)); break; } }
    else if (pick === 'airstream') { const R = AIRSTREAM_ART.Ro; if (ok(x, y, R, 700)) { out.push(mk('airstream', x, y, R)); break; } }
    else if (pick === 'crater') { const v = (() => { const k = r(); return k < 0.5 ? 0 : k < 0.85 ? 1 : 2; })(); const R = CRATER_ART[v].Ro; if (ok(x, y, R, 260)) { out.push(mk('crater', x, y, R, { variant: v })); break; } }
    else if (pick === 'pyramid') { const sc = 0.85 + r() * 0.3, R = PYR.Bx * sc * 1.15; if (ok(x, y, R, 260)) { out.push(mk('mound', x, y, R, { sc, variant: (r() * 2) | 0 })); break; } }
    else if (pick === 'ufo') { if (ok(x, y, 120, 260)) { out.push(mk('ufo', x, y, 78)); break; } }
    else if (pick === 'pit') {
      const pr = 60 + r() * 50;
      if (!ok(x, y, pr, 600)) continue;
      const pit = mk('pit', x, y, pr);
      if (r() < 0.6) { const a = r() * 6.283; out.push(mk('sign', x + Math.cos(a) * (pr + 55), y + Math.sin(a) * (pr + 55), 10, { art: 'sign_wood_2' })); }
      if (r() < 0.14) {            // sometimes a launch pyramid lined up with the abyss
        const a = r() * 6.283, sc = 0.9 + r() * 0.25, R = PYR.Bx * sc * 1.15, d = pr + R + 90;
        const mx = x + Math.cos(a) * d, my = y + Math.sin(a) * d;
        if (!ok(mx, my, R, 260)) continue;
        out.push(pit, mk('mound', mx, my, R, { sc, variant: (r() * 2) | 0 }));
      } else out.push(pit);
      break;
    }
  }
  bigCache.set(key, out);
  return out;
}
function bigNear(x0, y0, x1, y1) {
  const out = [];
  for (let by = Math.floor(y0 / BIG); by <= Math.floor(y1 / BIG); by++)
    for (let bx = Math.floor(x0 / BIG); bx <= Math.floor(x1 / BIG); bx++) out.push(...bigCell(bx, by));
  return out;
}

function genChunk(cx, cy) {
  const r = mulberry32(hash2(cx, cy, WORLD_SEED));
  const objs = [], dunes = [];
  const ox = cx * CHUNK, oy = cy * CHUNK;
  const nearSpawn = (x, y, m) => Math.hypot(x, y) < m;
  // landmarks centred in this chunk belong to it; nearby ones (incl. other chunks) block small props
  const bigs = bigNear(ox - 400, oy - 400, ox + CHUNK + 400, oy + CHUNK + 400);
  for (const b of bigs) if (Math.floor(b.x / CHUNK) === cx && Math.floor(b.y / CHUNK) === cy) objs.push(b);
  const free = (x, y, rad) => objs.every(o => Math.hypot(o.x - x, o.y - y) > o.r + rad + 30)
                           && bigs.every(o => Math.hypot(o.x - x, o.y - y) > o.r + rad + 30);
  let idn = 0;
  const roads = roadsNear(ox + CHUNK / 2, oy + CHUNK / 2);
  const add = (type, rad, extra = {}) => {
    for (let t = 0; t < 8; t++) {
      const x = ox + r() * CHUNK, y = oy + r() * CHUNK;
      if (nearSpawn(x, y, type === 'pit' ? 600 : type === 'airstream' ? 700 : 260)) continue;
      if (!free(x, y, rad)) continue;
      if (roadAt(x, y, Math.min(rad, 120) + 20, roads)) continue;       // keep the old roads clear
      const o = { type, x, y, r: rad, id: `${cx},${cy},${idn++}`, seed: (r() * 1e9) | 0, variant: (r() * 3) | 0, ...extra };
      objs.push(o); return o;
    }
  };
  // dunes: soft stipple blobs on the ground
  const nd = 1 + ((r() * 3) | 0);
  for (let i = 0; i < nd; i++) dunes.push({ x: ox + r() * CHUNK, y: oy + r() * CHUNK, rx: 120 + r() * 220, ry: 50 + r() * 90, a: r() * Math.PI, seed: (r() * 1e9) | 0 });
  // power towers along the lines that cross this chunk (placed first so nothing spawns on them)
  for (let i = Math.floor((ox - 300) / LINE_GAP); i <= Math.floor((ox + CHUNK + 300) / LINE_GAP); i++) {
    if (!powerLine(i)) continue;
    for (let k = Math.ceil(oy / TOWER_GAP); k * TOWER_GAP < oy + CHUNK; k++) {
      const T = tower(i, k);
      if (Math.floor(T.x / CHUNK) !== cx || Math.floor(T.y / CHUNK) !== cy) continue;

}

function land(g) {

function updateBullets(dt) {

/* ---------- critters & tumbleweeds (spawned around the player, not part of chunks) ---------- */
const CRITTER_TARGET = { jackalope: 3, coyote: 2, tumbleweed: 4, roadrunner: 2, bigfoot: 1 };

    x = car.x - Math.cos(wind.a) * d - Math.sin(wind.a) * side;
    y = car.y - Math.sin(wind.a) * d + Math.cos(wind.a) * side;
  } else {
    const a = Math.random() * 6.283, d = 850 + Math.random() * 450;

}
function updateCritters(dt) {

    if (kind === 'coyote' && !IMG.coyote) continue;   // waits for art
    if ((kind === 'bigfoot' || kind === 'roadrunner') && !IMG[kind]) continue;
    if (critters.filter(c => c.kind === kind).length < CRITTER_TARGET[kind] && Math.random() < dt * (CRITTER_SPAWN[kind] ?? 0.8)) spawnCritter(kind);
  }

    const dx = c.x - car.x, dy = c.y - car.y, d = Math.hypot(dx, dy);
    const carSpd = Math.hypot(car.vx, car.vy);

      c.x += c.vx * dt; c.y += c.vy * dt;
      c.t += dt * (2.2 + c.sc);

    if (c.kind === 'roadrunner') { updateRoadrunner(c, dt, dx, dy, d, carSpd); continue; }

    if (fleeing) c.scare = Math.max(c.scare, 0.5);
    const speed = c.kind === 'coyote' ? (fleeing ? 340 : 70) : (fleeing ? 300 : 90);
    c.t -= dt;
    if (fleeing) {
      if (c.state !== 'move' || c.t < 0) {
        const a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.8;
        c.vx = Math.cos(a) * speed; c.vy = Math.sin(a) * speed; c.state = 'move'; c.t = 0.6;
      }
    } else if (c.t < 0) {
      if (c.state === 'move' || Math.random() < 0.55) { c.state = 'idle'; c.vx = c.vy = 0; c.t = 1 + Math.random() * 3; c.pose = Math.random(); }
      else { const a = Math.random() * 6.283; c.vx = Math.cos(a) * speed; c.vy = Math.sin(a) * speed; c.state = 'move'; c.t = 0.8 + Math.random() * 1.5; }

/* road textures, pre-dissolved into 9 stipple levels so a road can fade into sand pixel by pixel.
   intact asphalt is backed with white so the ground dots don't show through it. */
let ROADTEX = null;
function prepRoadTex() {
  if (!IMG.road_0 || !IMG.road_1) return null;
  const make = (img, y0, y1, backX0, backX1, seed) => {
    const w = img.width, h = y1 - y0;
    const base = document.createElement('canvas'); base.width = w; base.height = h;
    const g = base.getContext('2d');
    if (backX1 > backX0) { g.fillStyle = PAPER; g.fillRect(backX0, 0, backX1 - backX0, h); }
    g.drawImage(img, 0, y0, w, h, 0, 0, w, h);
    const levels = [];
    let px = null;
    try { px = g.getImageData(0, 0, w, h); } catch (e) { px = null; }
    const rnd = mulberry32(seed);
    const noise = new Float32Array(w * h); for (let q = 0; q < noise.length; q++) noise[q] = rnd();
    for (let L = 0; L <= 8; L++) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const cg = c.getContext('2d');
      if (px) {
        const d = new ImageData(new Uint8ClampedArray(px.data), w, h), a = d.data, keep = L / 8;
        for (let q = 0; q < noise.length; q++) if (noise[q] >= keep) a[q * 4 + 3] = 0;
        cg.putImageData(d, 0, 0); c.alpha = 1;
      } else { cg.drawImage(base, 0, 0); c.alpha = L / 8; }   // no pixel access (opened from disk): plain fade
      levels.push(c);
    }
    return { levels, h };
  };
  return { intact: make(IMG.road_0, 0, 512, 44, 212, 11), buried: make(IMG.road_1, 40, 472, 0, 0, 23) };
}
// roads are painted once into cached 512px ground tiles (thin strips following the curve, so bends have
// no seams), then each frame just draws the few tiles on screen
const RT = 512, RT_RES = 1.25, roadTiles = new Map();
function roadTile(tx, ty) {
  const key = tx + ',' + ty;
  if (roadTiles.has(key)) return roadTiles.get(key);
  const ox = tx * RT, oy = ty * RT, pad = ROAD_W;
  const roads = roadsNear(ox + RT / 2, oy + RT / 2).filter(R => !(R.x1 < ox || R.x0 > ox + RT || R.y1 < oy || R.y0 > oy + RT));
  let c = null;
  if (roads.length) {
    c = document.createElement('canvas'); c.width = c.height = RT * RT_RES;
    const g = c.getContext('2d');
    g.setTransform(RT_RES, 0, 0, RT_RES, -ox * RT_RES, -oy * RT_RES);
    const SRC = 256 / ROAD_W;
    let any = false;
    for (const R of roads) for (const p of R.pts) {
      if (p.x < ox - pad || p.x > ox + RT + pad || p.y < oy - pad || p.y > oy + RT + pad || p.end <= 0.02) continue;
      any = true;
      g.save(); g.translate(p.x, p.y); g.rotate(p.h - Math.PI / 2);
      const layer = (T, keep) => {
        const L = Math.round(keep * 8); if (L <= 0) return;
        const t = T.levels[L], hs = ROAD_DS * SRC + 1.5;
        let v = (p.d * SRC) % (2 * T.h); if (v > T.h) v = 2 * T.h - v; v = Math.min(v, T.h - hs);   // ping-pong: no wrap seam
        if (t.alpha !== 1) g.globalAlpha = t.alpha;
        g.drawImage(t, 0, v, 256, hs, -ROAD_W / 2, -ROAD_DS / 2 - 0.6, ROAD_W, ROAD_DS + 1.2);
        g.globalAlpha = 1;
      };
      layer(ROADTEX.buried, p.end * Math.min(1, p.bur * 2));
      layer(ROADTEX.intact, p.end * (1 - p.bur));
      g.restore();
    }
    if (!any) c = null;
  }
  roadTiles.set(key, c);
  return c;
}
function drawRoads(camX, camY) {
  if (!ROADTEX) { ROADTEX = prepRoadTex(); if (!ROADTEX) return; roadTiles.clear(); }
  const x0 = Math.floor((camX - W / 2 - 50) / RT), x1 = Math.floor((camX + W / 2 + 50) / RT);
  const y0 = Math.floor((camY - H / K / 2 - 50) / RT), y1 = Math.floor((camY + H / K / 2 + 50) / RT);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const c = roadTile(tx, ty);
    if (c) ctx.drawImage(c, tx * RT, ty * RT, RT, RT);
  }
  if (roadTiles.size > 120) for (const k of roadTiles.keys()) {        // forget far-away tiles
    const [a, b] = k.split(',').map(Number);
    if (Math.abs(a - (x0 + x1) / 2) > 6 || Math.abs(b - (y0 + y1) / 2) > 6) roadTiles.delete(k);
  }
}

      ctx.lineWidth = 0.8; ctx.beginPath();
      for (const t of [0.33, 0.66]) { const A = m(q[0], q[1], t), B = m(q[3], q[2], t); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); }
      ctx.stroke();
      ctx.fillStyle = INK;
      for (const t of [0.12, 0.88]) for (const u of [0.15, 0.85]) {
        const A = q[0], B = q[1], C = q[3];
        const X = A[0] + (B[0] - A[0]) * t + (C[0] - A[0]) * u, Yw = A[1] + (B[1] - A[1]) * t + (C[1] - A[1]) * u, Z = A[2] + (B[2] - A[2]) * t + (C[2] - A[2]) * u;
        ctx.fillRect(X - 0.8, Yw * K - Z - 0.8, 1.6, 1.6);
      }
    }
  }
}

// car parts are drawn in car-local space: +x = forward
function chassis() {
  ctx.lineWidth = 1.6; ctx.strokeStyle = INK;
  // wheels
  for (const [wx, wy] of [[16, -15], [16, 15], [-17, -16], [-17, 16]]) {
    ctx.beginPath(); ctx.roundRect(wx - 7, wy - 4, 14, 8, 2);
    ctx.fillStyle = INK; ctx.fill();
  }
  // plow / ram on the front
  ctx.beginPath();
  ctx.moveTo(30, -19); ctx.lineTo(40, -10); ctx.lineTo(44, 0); ctx.lineTo(40, 10); ctx.lineTo(30, 19); ctx.lineTo(28, 0); ctx.closePath();
  ctx.fillStyle = PAPER; ctx.fill(); ctx.fillStyle = ST.mid; ctx.fill(); ctx.stroke();
  // ram spikes
  ctx.beginPath();
  for (const s of [-14, -6, 2, 10]) { ctx.moveTo(40 - Math.abs(s) * 0.4, s); ctx.lineTo(52 - Math.abs(s) * 0.5, s + 2); ctx.lineTo(40 - Math.abs(s + 4) * 0.4, s + 4); }
  ctx.fillStyle = INK; ctx.fill();
}
function body() {
  ctx.lineWidth = 1.8; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.roundRect(-28, -14, 60, 28, 6);
  ctx.fillStyle = PAPER; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = ST.light; ctx.fillRect(-28, 2, 60, 14); ctx.fillStyle = ST.mid; ctx.fillRect(-28, 9, 60, 8); ctx.restore();
  ctx.stroke();
  // hood scoop / blower
  ctx.beginPath(); ctx.roundRect(14, -5, 12, 10, 2); ctx.fillStyle = ST.dark; ctx.fill(); ctx.stroke();
  // side spikes
  ctx.fillStyle = INK; ctx.beginPath();
  for (const sx of [-20, -8, 4]) for (const s of [-1, 1]) { ctx.moveTo(sx, 14 * s); ctx.lineTo(sx + 3, 22 * s); ctx.lineTo(sx + 6, 14 * s); }
  ctx.fill();
  // twin guns
  ctx.fillStyle = INK;
  ctx.fillRect(20, -12, 16, 3); ctx.fillRect(20, 9, 16, 3);
  // exhaust stacks at back
  ctx.beginPath(); ctx.arc(-24, -9, 2.5, 0, 6.283); ctx.arc(-24, 9, 2.5, 0, 6.283); ctx.fill();
}
function cabin() {
  ctx.lineWidth = 1.6; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.roundRect(-14, -10, 22, 20, 4);
  ctx.fillStyle = PAPER; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = ST.light; ctx.fillRect(-14, 3, 22, 8); ctx.restore();
  ctx.stroke();
  // windshield
  ctx.beginPath(); ctx.moveTo(8, -9); ctx.lineTo(4, -7); ctx.lineTo(4, 7); ctx.lineTo(8, 9); ctx.closePath();
  ctx.fillStyle = ST.vdark; ctx.fill(); ctx.stroke();
  // roll-cage cross
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-12, -8); ctx.lineTo(2, 8); ctx.moveTo(-12, 8); ctx.lineTo(2, -8); ctx.stroke();
}

function drawParticles(which) {
  for (const p of particles) {
    if ((p.k === 'dust') !== (which === 'dust')) continue;
    const x = p.x, y = p.y * K - p.z;
    const t = p.life / p.max;
    if (p.k === 'smoke') {
      ctx.globalAlpha = Math.min(1, t * 1.5) * 0.7;
      ctx.beginPath(); ctx.arc(x + Math.sin(p.life * 3) * 3, y, p.s * (2.6 - t * 1.6), 0, 6.283);
      ctx.fillStyle = ST.light; ctx.fill(); ctx.globalAlpha = 1;
    } else if (p.k === 'dust') {
      ctx.globalAlpha = t * 0.8;
      ctx.beginPath(); ctx.arc(x, y, p.s * (1.6 - t * 0.6), 0, 6.283);
      ctx.fillStyle = ST.light; ctx.fill(); ctx.globalAlpha = 1;
    } else if (p.k === 'chunk') {
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot);
      ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.roundRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66, 1.5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = ST.mid; ctx.fill();
      ctx.restore();
    } else if (p.k === 'spark') {
      ctx.strokeStyle = INK; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.vx * 0.02, y - p.vy * 0.02 * K + p.vz * 0.02); ctx.stroke();
    } else if (p.k === 'shell') {
      ctx.fillStyle = INK; ctx.fillRect(x - 1, y - 1, 2.5, 2.5);
    } else if (p.k === 'flash' && IMG.fx_muzzle) {
      const sa = Math.atan2(Math.sin(p.a) * K, Math.cos(p.a));
      ctx.save(); ctx.translate(x, y); ctx.rotate(sa);
      ctx.drawImage(IMG.fx_muzzle, -6, -11, 44, 22); ctx.restore();
    } else if (p.k === 'flash') {
      ctx.save(); ctx.translate(x, y); ctx.scale(1, K); ctx.rotate(p.a);
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(14, 0); ctx.lineTo(0, 4); ctx.lineTo(4, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(6, -7); ctx.lineTo(7, 0); ctx.lineTo(6, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (p.k === 'boom') {
      const fr = Math.min(7, Math.floor((1 - t) * 8));
      if (IMG.fx_boom) {
        const fw = IMG.fx_boom.width / 8;
        ctx.drawImage(IMG.fx_boom, fr * fw, 0, fw, IMG.fx_boom.height, x - p.s / 2, y - p.s * 0.78, p.s, p.s);
      } else {
        const R = 20 + (1 - t) * 80; ctx.beginPath(); ctx.arc(x, y - R * 0.6, R, 0, 6.283);
        ctx.globalAlpha = t; ctx.fillStyle = ST.dark; ctx.fill(); ctx.globalAlpha = 1;
      }
    } else if (p.k === 'gib') {
      const sheet = IMG[p.who + '_gibs'];
      ctx.globalAlpha = Math.min(1, t * 3);
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot);
      if (sheet) ctx.drawImage(sheet, p.f * 32, 0, 32, 32, -p.s * 1.4, -p.s * 1.4, p.s * 2.8, p.s * 2.8);
      else if (p.who === 'buffalo') { inkLine([[-p.s, 0], [p.s, 0]], 2.4); ctx.beginPath(); ctx.arc(-p.s, 0, 2.5, 0, 6.283); ctx.arc(p.s, 0, 2.5, 0, 6.283); ctx.fillStyle = INK; ctx.fill(); }
      else { pathPts(wobblyPoly(0, 0, p.s * 0.7, p.s * 0.5, p.f + 11, 7, 0.35)); ctx.fillStyle = PAPER; ctx.fill(); ctx.fillStyle = p.who === 'alien' ? ST.mid : ST.dark; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.stroke(); }
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (p.k === 'drop') {
      ctx.fillStyle = INK; ctx.globalAlpha = Math.min(1, t * 2);
      ctx.beginPath(); ctx.ellipse(x, y, p.s, p.z > 0.5 ? p.s : p.s * 0.6, 0, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
    } else if (p.k === 'ember') {
      ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.globalAlpha = t;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random() - 0.5) * 3, y - p.s * 2); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (p.k === 'gibburst') {
      if (IMG.fx_gib) {
        const fr = Math.min(5, Math.floor((1 - t) * 6)), fw = IMG.fx_gib.width / 6;
        ctx.drawImage(IMG.fx_gib, fr * fw, 0, fw, IMG.fx_gib.height, x - p.s / 2, y - p.s / 2, p.s, p.s);
      } else {
        const R = p.s * 0.15 + (1 - t) * p.s * 0.35, r = mulberry32(7);
        ctx.fillStyle = INK; ctx.globalAlpha = t * 1.5;
        for (let i = 0; i < 16; i++) { const a = r() * 6.283, rr = R * (0.4 + r() * 0.7); ctx.beginPath(); ctx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.8, 2 + r() * 4 * t, 0, 6.283); ctx.fill(); }
        ctx.globalAlpha = 1;
      }
    } else if (p.k === 'twig') {
      ctx.strokeStyle = INK; ctx.lineWidth = 1;
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot);
      ctx.beginPath(); ctx.moveTo(-p.s, 0); ctx.lineTo(p.s, 0); ctx.moveTo(0, 0); ctx.lineTo(p.s * 0.5, -p.s * 0.6); ctx.stroke();
      ctx.restore();
    } else if (p.k === 'explode') {
      if (!IMG.fx_explode) continue;
      const fr = Math.min(5, Math.floor((1 - t) * 6)), fw = IMG.fx_explode.width / 6;
      ctx.drawImage(IMG.fx_explode, fr * fw, 0, fw, IMG.fx_explode.height, x - p.s / 2, y - p.s / 2, p.s, p.s);
    } else if (p.k === 'blast') {
      if (IMG.fx_explode) continue;
      const R = 10 + (1 - t) * 40;
      ctx.strokeStyle = INK; ctx.lineWidth = 2 * t + 0.5;
      ctx.beginPath();
      for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; ctx.moveTo(x + Math.cos(a) * R * 0.5, y + Math.sin(a) * R * 0.5 * K); ctx.lineTo(x + Math.cos(a) * R, y + Math.sin(a) * R * K); }
      ctx.stroke();
    }
  }
}

function drawVignette() {
  // stipple vignette at the edges = heat-haze darkness
  ctx.save();
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = g; ctx.globalAlpha = 0.18; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function stamp(text, x, y, size, align = 'center') {
  ctx.font = `900 ${size}px "Courier New", Courier, monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = INK; ctx.fillText(text, x, y);
}
function drawHUD() {
  if (state.mode === 'title') {
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(0, 0, W, H);
    const s = Math.min(W / 7, 140);
    if (IMG.logo) {
      const lw = Math.min(W * 0.8, 900), lh = lw * IMG.logo.height / IMG.logo.width;
      ctx.drawImage(IMG.logo, W / 2 - lw / 2, H * 0.34 - lh / 2, lw, lh);
    } else {
    ctx.save(); ctx.translate(W / 2, H * 0.4); ctx.rotate(-0.03);
    ctx.font = `900 ${s}px "Courier New", Courier, monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = ST.dark; ctx.fillText('WASTELAND', 5, 6);
    ctx.fillStyle = INK; ctx.fillText('WASTELAND', 0, 0);
    ctx.restore();
    }
    stamp('PRESS SPACE TO DRIVE', W / 2, H * 0.58, 22);
    stamp('W/↑ GAS   S/↓ BRAKE   A D / ← → STEER   SHIFT DRIFT   SPACE GUNS', W / 2, H * 0.66, 14);
    return;
  }
  // world units: speed px/s ÷ 4 = KPH, so 1 km = 4 × 3600 = 14,400 px
  const meters = stats.dist / PX_PER_KM * 1000;
  const km = meters < 1000 ? `${Math.floor(meters)} M` : `${(meters / 1000).toFixed(2)} KM`;
  stamp(`DIST ${km}`, 20, 28, 18, 'left');
  stamp(`CACTI ${stats.cacti}`, 20, 52, 18, 'left');
  stamp(`TNT ${stats.tnt}`, 20, 76, 18, 'left');
  stamp(`KILLS ${stats.kills}`, 20, 100, 18, 'left');
  const spd = car ? Math.round(Math.hypot(car.vx, car.vy) / PX_PER_KPH) : 0;
  stamp(`${spd} KPH`, W - 20, 28, 18, 'right');
  stamp('R RESTART', W - 20, 52, 12, 'right');

  if (state.mode === 'dead') {
    ctx.fillStyle = INK; ctx.globalAlpha = Math.max(0, Math.min(0.85, (state.deadT - (state.death === 'boom' ? 1.1 : 0)) * 1.5)); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    ctx.fillStyle = PAPER;
    ctx.font = `900 ${Math.min(W / 12, 72)}px "Courier New", monospace`; ctx.textAlign = 'center';
    if (state.death === 'boom' && state.deadT < 1.1) return;
    const word = state.death === 'boom' ? IMG[state.word || 'smithereens'] : null;
    if (word) {
      let im = word;
      if (state.word === 'smithereens' || !state.word) {    // black ink art: make a white-ink copy for the dark screen
        if (!IMG._smithW) {
          const c = document.createElement('canvas'); c.width = word.width; c.height = word.height;
          const g = c.getContext('2d'); g.drawImage(word, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = PAPER; g.fillRect(0, 0, c.width, c.height);
          IMG._smithW = c;
        }
        im = IMG._smithW;
      }
      let w = Math.min(W * 0.62, 720), h = w * im.height / im.width;
      const maxH = H * 0.2; if (h > maxH) { w *= maxH / h; h = maxH; }
      ctx.drawImage(im, W / 2 - w / 2, H * 0.47 - h, w, h);       // sits just above the score line
    } else ctx.fillText(state.death === 'boom' ? 'BLOWN TO PIECES' : 'SWALLOWED BY THE ABYSS', W / 2, H * 0.42);
    ctx.font = `700 20px "Courier New", monospace`;
    ctx.fillText(`${km}  ·  ${stats.cacti} CACTI  ·  ${stats.kills} KILLS`, W / 2, H * 0.52);
    if (state.deadT > (state.death === 'boom' ? 1.6 : 0.8)) ctx.fillText('PRESS R TO RIDE AGAIN', W / 2, H * 0.6);
  }
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
car = null; bullets = []; particles = []; tracks = []; shake = 0; stats = { dist: 0, cacti: 0, tnt: 0, kills: 0 };
requestAnimationFrame(frame);
</script>
