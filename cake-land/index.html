const IMG = {};
function loadAll(){
  const jobs=[['title','assets/title.jpg'],...Object.keys(MF).map(k=>[k,MF[k].src])];
  const fonts=[['Cinzel Decorative','assets/fonts/cinzel-decorative-900.woff2','900'],['Griffy','assets/fonts/griffy.woff2','400']]
    .map(([f,u,w])=>new FontFace(f,`url(${u})`,{weight:w}).load().then(ff=>document.fonts.add(ff)).catch(()=>{}));
  return Promise.all([...fonts,...jobs.map(([k,src])=>new Promise(res=>{const im=new Image();im.onload=()=>{IMG[k]=im;res();};im.onerror=()=>res();im.src=src;}))]);

// sprite-sheet frame anchored at the feet (x,y). Sheets are stored at 2x logical size.
function spr(key,c,x,y,idx=0,flip=false){const m=MF[key],im=IMG[key];if(!m||!im)return false;
  const q=idx%m.cols,r=Math.floor(idx/m.cols);c.save();c.translate(Math.round(x),Math.round(y));if(flip)c.scale(-1,1);
  c.drawImage(im,q*m.fw*2,r*m.fh*2,m.fw*2,m.fh*2,-m.ax,-m.ay,m.fw,m.fh);c.restore();return true;}
// packed image #idx, centered at (cx,cy) or bottom-centered when bottom=true
function pk(key,c,idx,cx,cy,bottom=false,scale=1,rot=0){const m=MF[key],im=IMG[key];if(!m||!im||!m.rects[idx])return false;
  const [sx,sy,sw,sh]=m.rects[idx],w=sw/2*scale,h=sh/2*scale;
  if(rot){c.save();c.translate(cx,cy);c.rotate(rot);c.drawImage(im,sx,sy,sw,sh,-w/2,-h/2,w,h);c.restore();return true;}
  c.drawImage(im,sx,sy,sw,sh,Math.round(cx-w/2),Math.round(bottom?cy-h:cy-h/2),w,h);return true;}
function pkRect(key,c,idx,x,y,w,h){const m=MF[key],im=IMG[key];if(!m||!im||!m.rects[idx])return false;const [sx,sy,sw,sh]=m.rects[idx];c.drawImage(im,sx,sy,sw,sh,x,y,w,h);return true;}

  c.drawImage(im,frame*m.fw*2,0,m.fw*2,m.fh*2,Math.round(L+Wd/2-m.fw*anchor),Math.round(B-m.fh),m.fw,m.fh);return true;}

function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function disc(c,cx,cy,r,col){c.fillStyle=col;cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);
  for(let dy=-r;dy<=r;dy++){const dx=Math.floor(Math.sqrt(r*r-dy*dy+r*0.8));c.fillRect(cx-dx,cy+dy,dx*2+1,1);}}
function oval(c,cx,cy,rx,ry,col){c.fillStyle=col;cx=Math.round(cx);cy=Math.round(cy);rx=Math.round(rx);ry=Math.round(ry);
  for(let dy=-ry;dy<=ry;dy++){const dx=Math.floor(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry+0.6))));c.fillRect(cx-dx,cy+dy,dx*2+1,1);}}

function poly(c,pts,col,ol){c.beginPath();c.moveTo(Math.round(pts[0][0]),Math.round(pts[0][1]));for(let i=1;i<pts.length;i++)c.lineTo(Math.round(pts[i][0]),Math.round(pts[i][1]));c.closePath();c.fillStyle=col;c.fill();if(ol){c.strokeStyle=ol;c.lineWidth=1;c.stroke();}}

function addStruct(s){
  structs.push(s);
  const rects=[...(s.solid===false?[]:[[s.x,s.y,s.w,s.h]]),...(s.extra||[])];
  for(const [x,y,w,h] of rects) for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++) if(inMap(xx,yy)) ssolid[ti(xx,yy)]=1;
  for(const d of (s.doors||[])){ ssolid[ti(d.x,d.y)]=0; W.trig.set(ti(d.x,d.y),d); }
  if(s.sign) W.signs.set(ti(s.x,s.y),s.sign);
  const top=s.top||2;
  for(let yy=s.y-top-1;yy<s.y+s.h+2;yy++)for(let xx=s.x-2;xx<s.x+s.w+2;xx++) if(inMap(xx,yy)) reserved[ti(xx,yy)]=1;
  for(const [x,y,w,h] of (s.extra||[])) for(let yy=y-1;yy<y+h+1;yy++)for(let xx=x-1;xx<x+w+1;xx++) if(inMap(xx,yy)) reserved[ti(xx,yy)]=1;
  return s;
}

function placeButter(){const r=mulberry32(99);BUTTER=[];for(let k=0;k<3000&&BUTTER.length<20;k++){const x=1+Math.floor(r()*70),y=1+Math.floor(r()*56);

function findBridges(){
  BRIDGES=[];const seen=new Uint8Array(MW*MH);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(seen[ti(x,y)]||getT(x,y)!==T.BRIDGE)continue;
    let x0=x,x1=x,y0=y,y1=y;const st=[[x,y]];seen[ti(x,y)]=1;
    while(st.length){const [cx,cy]=st.pop();x0=Math.min(x0,cx);x1=Math.max(x1,cx);y0=Math.min(y0,cy);y1=Math.max(y1,cy);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(inMap(nx,ny)&&!seen[ti(nx,ny)]&&getT(nx,ny)===T.BRIDGE){seen[ti(nx,ny)]=1;st.push([nx,ny]);}}}
    const my=(y0+y1)>>1,mx=(x0+x1)>>1,ew=getT(x0-1,my)===T.PATH||getT(x1+1,my)===T.PATH;
    BRIDGES.push({x0,x1,y0,y1,ew});}

function smoothGround(c){

  const tc=document.createElement('canvas');tc.width=64;tc.height=64;const tx=tc.getContext('2d');tx.drawImage(IMG.terrain,0,0);const tex=tx.getImageData(0,0,64,64).data;

      let best=0,bw=-1;for(let k=1;k<9;k++)if(k!==own&&w[k]>bw){bw=w[k];best=k;}
      if(!best||bw<=0)continue;
      const n=(vnoise(gx,gy)-0.5)*0.55+(vnoise(gx+97,gy+31,3)-0.5)*0.22, diff=bw-w[own]+n;

      else if(fin!==8&&oth===8&&Math.abs(diff)<0.05){d[i]*=0.7;d[i+1]*=0.7;d[i+2]*=0.7;}
      else if(fin===7&&oth!==7&&Math.abs(diff)<0.13){const k=Math.abs(diff)<0.06?0.5:0.7;d[i]*=k;d[i+1]*=k;d[i+2]*=k;}   // syrup bank
      else if(fin!==7&&oth===7&&Math.abs(diff)<0.05){d[i]*=0.75;d[i+1]*=0.75;d[i+2]*=0.75;}
      else if(fin!==1&&oth===1&&fin!==7&&Math.abs(diff)<0.07){d[i]*=0.82;d[i+1]*=0.82;d[i+2]*=0.82;}
    }
  }
  c.putImageData(img,0,0);
}

/* ============================ SNOWMAN STATUE ============================
   Dormant for the first 5 minutes of world time, then its light blinks.
   Bump it or bubble it while blinking -> Mr. Thunderman is released.
   After he goes home it rests a while, then starts blinking again. */
const STATUE={s:null,state:'dormant',t:0,cool:0,announced:false};
let worldTime=0;
const STATUE_WAIT=300;
function statueAt(tx,ty){const s=STATUE.s;return s&&tx>=s.x&&tx<s.x+s.w&&ty>=s.y&&ty<s.y+s.h;}
function statueHit(){
  if(STATUE.state==='blink'){STATUE.state='pressed';STATUE.t=0.7;sfx('select');shake=0.15;say('Click! The button sinks in... the statue starts to rumble!',3);}
  else if(STATUE.state==='dormant'&&msgCool<=0){msgCool=3;sfx('deny');say('Pancake pushes the button. Nothing happens. The statue\'s light is dark.',3);}
}
function updateStatue(dt){
  worldTime+=dt;
  if(STATUE.state==='dormant'){if(STATUE.cool>0)STATUE.cool-=dt;else if(worldTime>=STATUE_WAIT){STATUE.state='blink';
    if(!STATUE.announced){STATUE.announced=true;say('Pancake: "Huh? Something in the village square just started blinking..."',4.5);}}}
  else if(STATUE.state==='pressed'){STATUE.t-=dt;if(STATUE.t<=0){STATUE.state='active';STATUE.t=1.3;sfx('boss');shake=0.35;}}
  else if(STATUE.state==='active'){if(STATUE.t>0){STATUE.t-=dt;if(STATUE.t<=0)summonThunderman();}else if(!TM.active){STATUE.state='dormant';STATUE.cool=rand(60,90);}}
}

function boxCheck(x,y,hw,hh,bad){const x0=Math.floor((x-hw)/TS),x1=Math.floor((x+hw-0.01)/TS),y0=Math.floor((y-hh)/TS),y1=Math.floor((y-0.01)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(bad(tx,ty))return true;return false;}
function blockedAt(x,y,hw,hh){const sc=scene;return boxCheck(x,y,hw,hh,(tx,ty)=>tx<0||ty<0||tx>=sc.w||ty>=sc.h||sc.solid[ty*sc.w+tx]);}
function worldBlocked(x,y,hw,hh){return boxCheck(x,y,hw,hh,(tx,ty)=>!inMap(tx,ty)||wsolid[ti(tx,ty)]||W.trig.has(ti(tx,ty)));}
function frogBlocked(x,y,hw,hh){return boxCheck(x,y,hw,hh,(tx,ty)=>{if(!inMap(tx,ty))return true;const t=tiles[ti(tx,ty)];return !(t===T.SWAMP||t===T.POND)||ssolid[ti(tx,ty)];});}
function bubbleBlocked(x,y){const sc=scene,tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(tx<0||ty<0||tx>=sc.w||ty>=sc.h)return true;
  if(sc!==W)return !!sc.solid[ty*sc.w+tx];const t=tiles[ti(tx,ty)];return (t===T.TREE&&isBorder(tx,ty))||t===T.ROCK||!!ssolid[ti(tx,ty)];}

const SHOTS={top:{row:0,col:'#2a1a3a'},aviator:{row:1,col:'#cfe8ff'},bow:{row:2,col:'#ff7eb6'},beret:{row:3,col:'#e8344a'},

class PopFx{constructor(x,y,row){this.x=x;this.y=y;this.row=row;this.life=0.22;this.dead=false;}

class Bubble{constructor(x,y,dx,dy){this.x=x;this.y=y;this.vx=dx*175;this.vy=dy*175;this.life=0.85;this.t=0;this.dead=false;this.shot=SHOTS[P.hat]||null;}
  update(dt){this.t+=dt;this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;
    if(this.life<=0||bubbleBlocked(this.x,this.y-2)){if(scene===W&&this.life>0){const tx=Math.floor(this.x/TS),ty=Math.floor((this.y-2)/TS);if(statueAt(tx,ty))statueHit();tryThaw(tx,ty,!!(this.shot&&this.shot.row===5));}this.pop();return;}
    if(scene!==W)return;
    for(const e of ents){if(e.dead||!e.onBubble||e.hittable===false)continue;if(Math.hypot(e.x-this.x,e.y-this.y)<e.r+5||(e.bodyY&&Math.hypot(e.x-this.x,e.bodyY()-this.y)<e.r+5)){e.onBubble(this);this.pop();return;}}}
  pop(){this.dead=true;const s=this.shot;burst(this.x,this.y-10,s?s.col:'#9cff6b',6,40);if(s&&IMG.hatShots)fx.push(new PopFx(this.x,this.y,s.row));}
  draw(c,x,y){const by=y-10+Math.sin(this.t*20)*1.5;
    const s=this.shot;if(s&&IMG.hatShots){const idx=s.row*3+(Math.floor(this.t*12)%2);
      if(s.aim){c.save();c.translate(x,s.aim?y-10:by);if(this.vx<0)c.scale(-1,1);else if(this.vy)c.rotate(this.vy>0?Math.PI/2:-Math.PI/2);pk('hatShots',c,idx,0,0);c.restore();}
      else pk('hatShots',c,idx,x,by);return;}
    if(pk('items',c,4,x,by))return;disc(c,x,by,5,'#1f6b1f');disc(c,x,by,4,'#66e04a');disc(c,x+1,by+1,2,'#4cc23a');rect(c,x-2,by-3,2,2,'#e8ffd0');}}

function updatePlayer(dt){
  P.inv=Math.max(0,P.inv-dt);P.cool=Math.max(0,P.cool-dt);P.cheerT=Math.max(0,P.cheerT-dt);P.yawnT=Math.max(0,P.yawnT-dt);P.shootFlash=Math.max(0,P.shootFlash-dt);P.zapT=Math.max(0,P.zapT-dt);

  if(mx||my){const dx=mx*sp*dt,dy=my*sp*dt;
    if(dx){if(!blockedAt(P.x+dx,P.y,5,6))P.x+=dx;else if(!my)nudge('y',dx);}

function makeInterior(name,def){

  for(const t of def.trig){for(const [x,y] of t.tiles){sc.solid[y*w+x]=0;sc.trig.set(y*w+x,t);}}

  rect(c,0,0,16,PH,def.side);rect(c,PW-16,0,16,PH,def.side);rect(c,14,32,2,PH-48,'#2a1a10');rect(c,PW-16,32,2,PH-48,'#2a1a10');rect(c,0,PH-16,PW,16,def.side);rect(c,0,PH-16,PW,2,'#2a1a10');

    c.fillStyle='#9b5a2b';c.fillRect(cx-10,top+11,20,PH-top-11);c.beginPath();c.arc(cx,top+11,10,Math.PI,0);c.fill();
    for(const px of [-5,0,5])rect(c,cx+px,top+3,1,PH-top-3,'#7a4420');
    rect(c,cx-10,top+18,20,2,'#7a4420');rect(c,cx-10,PH-8,20,2,'#7a4420');

  const flat=f=>f.wall||f.k.startsWith('rug')||f.k.startsWith('stairs');
  // furniture and the player are drawn in order of their bottom edge, so Pancake can stand behind things
  sc.drawFurn=(ctx,actor)=>{const one=f=>{if(!furnSprite(ctx,f))FURN[f.k](ctx,f.x*16,f.y*16,f.w*16,f.h*16);};
    for(const f of def.furn)if(flat(f))one(f);
